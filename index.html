<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Loading PPT Maker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px 16px; }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 700; color: #f8fafc; }
  .header p { color: #94a3b8; margin-top: 6px; font-size: 14px; }

  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .count-btn {
    padding: 10px 24px; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; border: 2px solid #334155; background: #1e293b; color: #94a3b8; transition: all 0.2s;
  }
  .count-btn.active { border-color: #3b82f6; background: #1d4ed8; color: #fff; }

  .date-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; }
  .date-row label { font-size: 13px; color: #94a3b8; font-weight: 500; }
  .date-row input {
    background: #1e293b; border: 1.5px solid #334155; color: #e2e8f0;
    border-radius: 8px; padding: 8px 14px; font-size: 14px;
  }
  .date-row input:focus { outline: none; border-color: #3b82f6; }

  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto 24px; }

  .photo-card { background: #1e293b; border: 1.5px solid #334155; border-radius: 12px; overflow: hidden; }
  .card-header {
    background: #162032; padding: 10px 14px; font-size: 13px; font-weight: 600;
    color: #7dd3fc; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #2d3f56;
  }
  .card-num {
    width: 22px; height: 22px; background: #1d4ed8; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }

  /* FIX 14: Fixed height container so card doesn't shift on image load */
  .photo-drop {
    height: 180px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; background: #162032;
    border-bottom: 1px solid #2d3f56; overflow: hidden; transition: background 0.2s; position: relative;
  }
  .photo-drop:hover { background: #1a2a42; }
  .photo-drop img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-drop .drag-over-overlay {
    display: none; position: absolute; inset: 0; background: rgba(59,130,246,0.25);
    border: 2px dashed #3b82f6; align-items: center; justify-content: center;
    font-size: 14px; color: #7dd3fc; font-weight: 600;
  }
  .photo-drop.dragging .drag-over-overlay { display: flex; }
  .upload-icon { font-size: 30px; margin-bottom: 6px; opacity: 0.5; }
  .upload-hint { font-size: 11px; color: #64748b; text-align: center; margin-top: 4px; }
  .upload-text { font-size: 12px; color: #64748b; text-align: center; }
  .upload-text span { color: #3b82f6; font-weight: 600; }

  /* FIX 10: Mobile tap hint */
  .mobile-hint { display: none; font-size: 11px; color: #475569; text-align: center; margin-top: 4px; }
  @media (pointer: coarse) { .mobile-hint { display: block; } .upload-hint { display: none; } }

  .photo-remove {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.65);
    color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px;
    cursor: pointer; font-size: 14px; display: none; align-items: center; justify-content: center; z-index: 2;
  }
  .photo-drop.has-image .photo-remove { display: flex; }

  .card-fields { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }
  .field label { font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 4px; text-transform: uppercase; }
  .field input {
    width: 100%; background: #0f172a; border: 1.5px solid #2d3f56;
    color: #e2e8f0; border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: #3b82f6; }
  .field input::placeholder { color: #374151; }

  /* FIX 2: Caption now shows formatted lines, not a blob */
  .caption-preview {
    font-size: 11px; color: #7dd3fc; padding: 6px 8px; min-height: 36px;
    background: #0f172a; border-radius: 5px; border: 1px solid #1e3a5f; line-height: 1.6;
  }

  .generate-row { text-align: center; margin-bottom: 14px; }
  .gen-btn {
    background: #1d4ed8; color: #fff; border: none; padding: 14px 44px;
    border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .gen-btn:hover:not(:disabled) { background: #2563eb; transform: translateY(-1px); }
  .gen-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .status {
    text-align: center; font-size: 14px; padding: 12px 20px; border-radius: 8px;
    margin: 8px auto; max-width: 520px; display: none; line-height: 1.5;
  }
  .status.success { background: #052e16; color: #86efac; border: 1px solid #166534; display: block; }
  .status.error   { background: #450a0a; color: #fca5a5; border: 1px solid #991b1b; display: block; }
  .status.loading { background: #1e3a5f; color: #93c5fd; border: 1px solid #1d4ed8; display: block; }

  #libStatus { text-align: center; font-size: 12px; color: #64748b; margin-bottom: 12px; min-height: 18px; }
</style>
</head>
<body>

<div class="header">
  <h1>🚛 Vehicle Loading PPT Maker</h1>
  <p>Upload photos → Fill details → Download your presentation</p>
</div>

<div id="libStatus">⏳ Loading PPT engine…</div>

<div class="controls">
  <button class="count-btn" onclick="setCount(2,this)">2 Photos</button>
  <button class="count-btn active" onclick="setCount(3,this)">3 Photos</button>
  <button class="count-btn" onclick="setCount(4,this)">4 Photos</button>
  <button class="count-btn" onclick="setCount(5,this)">5 Photos</button>
</div>

<div class="date-row">
  <label>📅 Date:</label>
  <!-- FIX 9: Use date input type for clean ISO date, format on generate -->
  <input type="date" id="dateInput" />
</div>

<div class="cards-grid" id="cardsGrid"></div>

<div class="generate-row">
  <button class="gen-btn" id="genBtn" onclick="generatePPT()">⬇️ Generate &amp; Download PPT</button>
</div>
<div class="status" id="statusMsg"></div>

<!-- FIX 8: Use standard script tag; library readiness checked via polling fallback -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>

<script>
// ─────────────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────────────
let photoCount = 3;

// FIX 1: Single source of truth — all state (image data + field values) lives
// here, never read back from DOM inputs.
// Shape: { [idx]: { imgSrc, veh, drv, tim, loc } }
const photoData = {};

// ─────────────────────────────────────────────────────────────
//  LIBRARY READINESS  (FIX 8)
// ─────────────────────────────────────────────────────────────
const libStatusEl = document.getElementById('libStatus');

function isLibReady() { return typeof PptxGenJS !== 'undefined'; }

// Poll until library is ready (handles async script load race)
(function waitForLib() {
  if (isLibReady()) {
    libStatusEl.textContent = '✅ PPT engine ready';
    libStatusEl.style.color = '#4ade80';
    setTimeout(() => { libStatusEl.style.display = 'none'; }, 2000);
  } else {
    libStatusEl.textContent = '⏳ Loading PPT engine…';
    setTimeout(waitForLib, 200);
  }
})();

// ─────────────────────────────────────────────────────────────
//  PHOTO COUNT
// ─────────────────────────────────────────────────────────────
function setCount(n, btn) {
  photoCount = n;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

// ─────────────────────────────────────────────────────────────
//  RENDER CARDS
// ─────────────────────────────────────────────────────────────
function renderCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  for (let i = 1; i <= photoCount; i++) {
    // Ensure slot exists in state
    if (!photoData[i]) photoData[i] = { imgSrc: null, veh: '', drv: '', tim: '', loc: '' };

    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-num">${i}</div> Vehicle Photo ${i}
      </div>
      <div class="photo-drop" id="drop${i}">
        <div class="drag-over-overlay">Drop photo here</div>
        <div class="upload-icon">📷</div>
        <div class="upload-text"><span>Click to upload</span><br>JPG / PNG</div>
        <div class="upload-hint">or drag &amp; drop</div>
        <div class="mobile-hint">Tap to select photo</div>
        <button class="photo-remove" onclick="removePhoto(event,${i})" title="Remove photo">✕</button>
      </div>
      <div class="card-fields">
        <div class="field">
          <label>Vehicle Number</label>
          <input type="text" id="veh${i}" placeholder="e.g. TN 13 AK 1242"
                 value="${escAttr(photoData[i].veh)}" oninput="onFieldChange(${i})">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Driver Name</label>
            <input type="text" id="drv${i}" placeholder="Praveen"
                   value="${escAttr(photoData[i].drv)}" oninput="onFieldChange(${i})">
          </div>
          <div class="field">
            <label>Out Time</label>
            <input type="text" id="tim${i}" placeholder="4:45 AM"
                   value="${escAttr(photoData[i].tim)}" oninput="onFieldChange(${i})">
          </div>
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="loc${i}" placeholder="Collection warehouse"
                 value="${escAttr(photoData[i].loc)}" oninput="onFieldChange(${i})">
        </div>
        <div class="field">
          <label>Caption Preview</label>
          <div class="caption-preview" id="prev${i}"></div>
        </div>
      </div>
    `;
    grid.appendChild(card);

    // Restore image if already uploaded
    if (photoData[i].imgSrc) applyImage(i, photoData[i].imgSrc);

    // Update preview from restored state (no setTimeout race — values already in DOM via value attr)
    refreshPreview(i);

    // Wire up drop zone
    wireDropZone(i);
  }
}

// ─────────────────────────────────────────────────────────────
//  FIELD CHANGE  (FIX 1 — write to state, not read from DOM later)
// ─────────────────────────────────────────────────────────────
function onFieldChange(idx) {
  const s = photoData[idx];
  s.veh = document.getElementById(`veh${idx}`).value;
  s.drv = document.getElementById(`drv${idx}`).value;
  s.tim = document.getElementById(`tim${idx}`).value;
  s.loc = document.getElementById(`loc${idx}`).value;
  refreshPreview(idx);
}

// ─────────────────────────────────────────────────────────────
//  CAPTION  (FIX 2 — formatted lines, not a single blob)
// ─────────────────────────────────────────────────────────────
function buildCaptionLines(d) {
  const lines = [];
  if (d.veh) lines.push(d.veh);
  if (d.drv) lines.push(d.drv);
  if (d.loc) lines.push(d.loc);
  if (d.tim) lines.push('Out time - ' + d.tim);
  return lines; // array of strings
}

function buildCaptionString(d) {
  return buildCaptionLines(d).join('\n');
}

function refreshPreview(idx) {
  const el = document.getElementById(`prev${idx}`);
  if (!el) return;
  const lines = buildCaptionLines(photoData[idx]);
  el.innerHTML = lines.length
    ? lines.map(l => `<div>${escHtml(l)}</div>`).join('')
    : '<span style="color:#475569">—</span>';
}

// ─────────────────────────────────────────────────────────────
//  IMAGE HANDLING
// ─────────────────────────────────────────────────────────────
function wireDropZone(idx) {
  const drop = document.getElementById(`drop${idx}`);
  if (!drop) return;

  // Click to pick file
  drop.addEventListener('click', (e) => {
    if (e.target.classList.contains('photo-remove')) return; // handled separately
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    // FIX 10: capture attribute helps mobile cameras
    inp.setAttribute('capture', 'environment');
    inp.onchange = e => { if (e.target.files[0]) handleFile(idx, e.target.files[0]); };
    inp.click();
  });

  // Drag & drop
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragging'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('dragging');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(idx, file);
    else showStatus('⚠️ Please drop an image file (JPG/PNG)', 'error');
  });
}

function handleFile(idx, file) {
  // Basic file type guard
  if (!file.type.startsWith('image/')) {
    showStatus('⚠️ Only image files (JPG, PNG, WEBP) are accepted.', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    photoData[idx].imgSrc = e.target.result;
    applyImage(idx, e.target.result);
  };
  reader.onerror = () => showStatus('❌ Could not read file. Try again.', 'error');
  reader.readAsDataURL(file);
}

function applyImage(idx, src) {
  const drop = document.getElementById(`drop${idx}`);
  if (!drop) return;
  // Clear placeholder content, insert img
  drop.innerHTML = `
    <img src="${src}" alt="Photo ${idx}" style="width:100%;height:100%;object-fit:cover;display:block;">
    <button class="photo-remove" onclick="removePhoto(event,${idx})" title="Remove photo">✕</button>
  `;
  drop.classList.add('has-image');
}

function removePhoto(e, idx) {
  e.stopPropagation(); // prevent triggering file picker
  photoData[idx].imgSrc = null;
  const drop = document.getElementById(`drop${idx}`);
  if (!drop) return;
  drop.classList.remove('has-image', 'dragging');
  drop.innerHTML = `
    <div class="drag-over-overlay">Drop photo here</div>
    <div class="upload-icon">📷</div>
    <div class="upload-text"><span>Click to upload</span><br>JPG / PNG</div>
    <div class="upload-hint">or drag &amp; drop</div>
    <div class="mobile-hint">Tap to select photo</div>
    <button class="photo-remove" onclick="removePhoto(event,${idx})" title="Remove photo">✕</button>
  `;
  wireDropZone(idx); // re-wire after innerHTML reset
}

// ─────────────────────────────────────────────────────────────
//  STATUS HELPER
// ─────────────────────────────────────────────────────────────
function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status ' + type;
}

// ─────────────────────────────────────────────────────────────
//  DATE HELPERS  (FIX 9)
// ─────────────────────────────────────────────────────────────
function getTodayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateDisplay(isoStr) {
  if (!isoStr) return '';
  const [y, m, day] = isoStr.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${day}-${months[parseInt(m,10)-1]}-${y}`;
}

// ─────────────────────────────────────────────────────────────
//  GENERATE PPT  (fixes 4, 5, 12, 13)
// ─────────────────────────────────────────────────────────────
async function generatePPT() {
  // FIX 8: Library readiness check
  if (!isLibReady()) {
    showStatus('❌ PPT library not loaded yet. Please wait a moment and try again.', 'error');
    return;
  }

  // FIX 5: Clear validation — list exactly which cards are missing photos
  const missing = [];
  for (let i = 1; i <= photoCount; i++) {
    if (!photoData[i]?.imgSrc) missing.push(i);
  }
  if (missing.length) {
    showStatus(`⚠️ Please upload a photo for card${missing.length > 1 ? 's' : ''}: ${missing.map(n => '#' + n).join(', ')}`, 'error');
    return;
  }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Building PPT…';
  showStatus('⏳ Generating your presentation, please wait…', 'loading');

  // Yield to browser so UI updates before heavy work
  await new Promise(r => setTimeout(r, 60));

  try {
    const dateISO     = document.getElementById('dateInput').value || getTodayISO();
    const dateDisplay = formatDateDisplay(dateISO);
    const dateForFile = dateISO; // YYYY-MM-DD — clean filename

    const pptx = new PptxGenJS();
    pptx.layout = 'LAYOUT_WIDE'; // 13.33 × 7.5 in

    // Slide dimensions (inches)
    const SLIDE_W   = 13.33;
    const SLIDE_H   = 7.5;
    const MARGIN    = 0.25;
    const HEADER_H  = 1.0;
    const FOOTER_H  = 0.55;
    const GAP       = 0.25;

    // Photo area
    const PHOTO_TOP  = HEADER_H + 0.1;
    const PHOTO_H    = SLIDE_H - PHOTO_TOP - FOOTER_H - MARGIN;
    const PHOTO_W_2  = (SLIDE_W - MARGIN * 2 - GAP) / 2; // two-per-slide width
    const PHOTO_W_1  = SLIDE_W - MARGIN * 2;               // FIX 4: one-per-slide, full width

    // Build slides: 2 photos per slide
    for (let i = 0; i < photoCount; i += 2) {
      const li = i + 1;
      const ri = (i + 2 <= photoCount) ? i + 2 : null;
      const slide = pptx.addSlide();
      slide.background = { color: 'FFFFFF' };

      // ── Header bar ──
      slide.addShape(pptx.ShapeType.rect, {
        x: 0, y: 0, w: SLIDE_W, h: HEADER_H - 0.05,
        fill: { color: '0F1C3F' }, line: { width: 0 }
      });

      // Company name (FIX 3: replaced broken base64 logo with clean text branding)
      slide.addText('🚛 UDDHAVA LOGISTICS', {
        x: MARGIN, y: 0.15, w: 5.5, h: 0.55,
        fontSize: 18, bold: true, color: 'FFFFFF', fontFace: 'Arial',
        valign: 'middle'
      });
      slide.addText('Vehicle Loading Photo Report', {
        x: MARGIN, y: 0.62, w: 5, h: 0.28,
        fontSize: 10, color: '7DD3FC', fontFace: 'Arial',
      });

      // Date (right aligned)
      slide.addText(dateDisplay, {
        x: SLIDE_W - 3.5, y: 0.2, w: 3.2, h: 0.4,
        fontSize: 13, color: '94A3B8', align: 'right', fontFace: 'Arial',
      });

      // Slide number
      const slideNum = Math.floor(i / 2) + 1;
      const totalSlides = Math.ceil(photoCount / 2);
      slide.addText(`${slideNum} / ${totalSlides}`, {
        x: SLIDE_W - 1.5, y: 0.58, w: 1.2, h: 0.3,
        fontSize: 10, color: '475569', align: 'right', fontFace: 'Arial',
      });

      // Amber accent strip
      slide.addShape(pptx.ShapeType.rect, {
        x: 0, y: HEADER_H - 0.05, w: SLIDE_W, h: 0.05,
        fill: { color: 'F59E0B' }, line: { width: 0 }
      });

      // ── Photos ──
      if (ri) {
        // Two photos: FIX 12 — proper GAP between them
        slide.addImage({ data: photoData[li].imgSrc, x: MARGIN, y: PHOTO_TOP, w: PHOTO_W_2, h: PHOTO_H });
        slide.addImage({ data: photoData[ri].imgSrc, x: MARGIN + PHOTO_W_2 + GAP, y: PHOTO_TOP, w: PHOTO_W_2, h: PHOTO_H });

        // Captions
        addCaption(slide, photoData[li], MARGIN, PHOTO_TOP + PHOTO_H + 0.06, PHOTO_W_2, FOOTER_H - 0.1);
        addCaption(slide, photoData[ri], MARGIN + PHOTO_W_2 + GAP, PHOTO_TOP + PHOTO_H + 0.06, PHOTO_W_2, FOOTER_H - 0.1);
      } else {
        // FIX 4: Odd slide — single photo centred, full width
        slide.addImage({ data: photoData[li].imgSrc, x: MARGIN, y: PHOTO_TOP, w: PHOTO_W_1, h: PHOTO_H });
        addCaption(slide, photoData[li], MARGIN, PHOTO_TOP + PHOTO_H + 0.06, PHOTO_W_1, FOOTER_H - 0.1);
      }

      // ── Footer ──
      slide.addShape(pptx.ShapeType.rect, {
        x: 0, y: SLIDE_H - 0.22, w: SLIDE_W, h: 0.22,
        fill: { color: 'F1F5F9' }, line: { width: 0 }
      });
      slide.addText('Uddhava Logistics — Daily Vehicle Loading Documentation', {
        x: 0, y: SLIDE_H - 0.22, w: SLIDE_W, h: 0.22,
        fontSize: 9, color: '94A3B8', align: 'center', valign: 'middle', fontFace: 'Arial',
      });
    }

    // FIX 13: PptxGenJS 3.x write API — pass string 'blob', not object
    const blob = await pptx.write('blob');

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Vehicle_Loading_${dateForFile}.pptx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Revoke after a safe delay
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    showStatus('✅ PPT downloaded! Check your Downloads folder.', 'success');
  } catch (err) {
    console.error('[PPT Error]', err);
    showStatus('❌ Error: ' + (err.message || 'Unknown error. See browser console.'), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '⬇️ Generate & Download PPT';
  }
}

// ─────────────────────────────────────────────────────────────
//  CAPTION SHAPE HELPER  (FIX 2 — multi-line, properly formatted)
// ─────────────────────────────────────────────────────────────
function addCaption(slide, data, x, y, w, h) {
  const lines = buildCaptionLines(data);
  if (!lines.length) return;

  // Background pill
  slide.addShape(slide._slideObjects ? 'rect' : 'rect', { // pptx.ShapeType.rect not on slide
    x, y, w, h,
    fill: { color: 'F1F5F9' },
    line: { color: 'E2E8F0', width: 0.75 }
  });

  // Multi-line text with bold vehicle number
  const textArr = lines.map((line, idx) => ({
    text: line,
    options: {
      fontSize: idx === 0 ? 13 : 11,
      bold: idx === 0,
      color: idx === 0 ? '0F172A' : '475569',
      breakLine: true,
    }
  }));

  slide.addText(textArr, {
    x: x + 0.1, y: y + 0.04, w: w - 0.2, h: h - 0.08,
    fontFace: 'Arial', align: 'center', valign: 'middle',
    wrap: true,
  });
}

// ─────────────────────────────────────────────────────────────
//  UTILS
// ─────────────────────────────────────────────────────────────
function escAttr(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────────────────────────
